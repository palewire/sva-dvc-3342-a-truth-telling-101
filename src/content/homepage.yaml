introduction:
  kicker: 'About the course'
  title: 'Interview the data.'
  firstParagraph: 'This introduction is for artists, academics, advocates, designers, researchers, and other communicators outside journalism who want to learn how reporters work with data.'
  secondParagraph: 'We will move from identifying questions and locating data through preparing, analyzing, verifying, visualizing, and reporting what we find. The focus is on testing claims and telling accurate, humane stories—not coding for its own sake.'
  quote: 'social science in a hurry'
  quoteAttribution: 'Philip Meyer on computer-assisted reporting'

